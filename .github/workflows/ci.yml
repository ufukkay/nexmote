name: NexMote CI / CD Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build:
    name: .NET 8 Solution Build
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore NexMote.sln

      - name: Build Full Solution (Release)
        run: dotnet build NexMote.sln --configuration Release --no-restore

      - name: Check NuGet Package Vulnerabilities
        run: dotnet list NexMote.sln package --vulnerable

      - name: Run Regression Tests
        run: dotnet test tests/NexMote.Tests/NexMote.Tests.csproj --configuration Release --logger "trx;LogFileName=regression.trx" --results-directory TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  frontend-web:
    name: React Web Build, TypeCheck & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Web Console (Vite)
        run: npm run build

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-gate-passed:
    name: All Quality Gates Passed
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-web, secret-scan]
    steps:
      - name: Gate Summary
        run: echo "Tüm kalite kapıları (.NET Build & Test, React TypeCheck & Build, Bağımlılık & Güvenlik Denetimi) başarıyla geçti."
